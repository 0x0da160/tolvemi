name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Example test cases
        run: |
          for f in examples/*.tlvm; do
            ./target/release/tlvm test "$f" --human
          done
      - name: Eval set check
        run: |
          python3 eval/check.py
          python3 -m unittest discover -s eval -p 'test_*.py'

  python-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/tlvm-py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: crates/tlvm-py/build.sh
      - name: Test
        run: python3 -m unittest discover -s crates/tlvm-py -p 'test_*.py' -v
