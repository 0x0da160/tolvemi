[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tolvemi"
version = "0.1.0"
description = "Tolvemi (tlvm): Python reference implementation of LPTL v1"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tlvm = "tolvemi.cli:main"

[tool.setuptools]
packages = ["tolvemi"]
