# LPTL v1 処理系の信頼境界（設計書 §11.3）
#
# この版は V1-A（外部 BigInt を信頼仮定とする版）に相当する。受理・拒否の判定と実行
# （字句・構文・整形・名前解決・型検査・入力 JSON の復号・評価・出力 encode）は Verus で検証した
# 部品が行うが、spec 層の人手レビュー、診断、資源上限、接着部分が未検証で、BigInt を信頼しているので、
# 処理系全体を「完全に形式検証済み」とは呼ばない。

version = "V1-A"
spec = "spec/lptl-v1/LPTL_design_v1.md"

[spec_review]
# spec 層が設計書の意味論を正しく写しているかは人手レビューに依る。
status = "unreviewed"
files = [
  "verus/src/spec.rs",
  "verus/src/syntax.rs",
  "verus/src/resolve.rs（spec 部分：rx、resolve。型の表（decl_table、tb_push）と字段の持ち主（owner_pos、owner_at、fld_chain）の規則は、S2a、S2b、S3a、S3b の証明で resolve_e と resolve_tagged_e の結果が resolve_t と一致する（resolve.rs:3669、3680）。spec の人手レビューは残る。直和型の構築子（rctor）と match（arms_sum、smatch_from、smatch_top）の spec も同じく人手レビューの対象（2026-10-28）。G2（オーナーの承認 2026-10-20、803db9c）：関数の注釈と本体は、後で宣言した型を使える（resolve_t は宣言の全部の表を引く。resolve.rs:1088。この規則は設計書 125 行に書かれていない。同行の最初の文「型の宣言は使う前に行う」と読み合わせると食い違う。spec は変えていない）。宣言の中の字段の型と直和型の中身は、前に宣言した型に限る（設計書 125 行））",
  "verus/src/input.rs",
  "verus/src/json.rs（enc）",
]
notes = [
  "名前は name phase で解決済みとし、変数と binder は nat、関数は添字で表す",
  "呼出しグラフの DAG 性はランク証明書 Prog::rank と型付け条件 rank[callee] < rank[caller] で表す",
  "v1.7：Prog::rec（関数ごとの rec の印）。印のある関数への呼出しはランクの条件を免除する。印の列は未検証の接着部分が作る（落とせば拒否、余計に付ければ停止の保証を失うだけ）",
  "資源上限（steps、AllocatedNodes、IntegerBits）は spec 層に含まない。燃料は停止性のための抽象",
  "出力の正準 JSON は json.rs の enc で定める",
  "表面構文は syntax.rs の lex（字句）と parse（EBNF、式と型の入れ子の深さ上限つき）で、正準整形は fds で定める",
  "名前規則（関数名の一意性、変数の scope、shadowing と fold binder 重複の拒否、entry の存在と一引数、型名の一意性、字段名のプログラム全体での一意性、宣言の中の字段の型と直和型の中身は前に宣言した型だけ）は resolve.rs の resolve で定める（規則は resolve.rs:5–6、字段の検査は fields_ok と tb_push、140 行）。型名と字段名の重複と前方参照は、検証済みの resolve が拒否する（S2a）。拒否の符号と位置は信頼（records.rs:625–629、sums.rs:176–232）",
  "入力 JSON は input.rs の jparse（strict JSON、構造の入れ子の深さ上限つき）と jd（値 JSON）で定める。文字列は Unicode scalar 値の列として読み、対にならない surrogate は拒否する",
  "入力の資源上限（値の深さ・node 数・整数の桁数）は spec に含まない",
"v1.9：入力の辞書 Dict<K, V> は、検証済みの復号器では (鍵, 値) の対のリストとして読む（型は derase で List<Pair<K, V>> に消去）。鍵の重複は、鍵の正準 JSON（enc）が等しい二つの項として定める。受理の条件は鍵が相異なること。どの重複を最初の誤りとするかは dupfirst が values.rs の順で定める",
  "v1.2：文字はスカラー値（scalar）で、Val::Char の型付けがそれを含む。String は List<Char> で、型の綴りは String だけ（pt が List<Char> を拒否）。文字列リテラルは名前解決で文字のリストの式になる（str_exprs）",
]

