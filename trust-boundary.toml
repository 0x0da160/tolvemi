unsafe = []
tests = "cargo test --release（回帰テスト）。検証済み部品に切り替える前の処理系との差分テスト（型付きプログラム 400 件、字句・名前を壊したプログラム 2900 件、入力 JSON 4000 件）で出力・診断・終了コードが一致"

[libraries]
num-bigint = { version = "0.4", role = "BigInt（V1-A の信頼仮定）" }
num-integer = { version = "0.1", role = "mod_floor" }
num-traits = { version = "0.2", role = "数値 trait" }
vstd = { version = "0.0.0-2026-10-04-0306", role = "Verus の標準ライブラリ（Seq、Map、Vec と String の仕様、算術補題）" }

[platform]
trusted = ["Rust コンパイラ", "Rust 標準ライブラリ", "OS", "CPU", "アロケータ", "Verus", "Z3"]
