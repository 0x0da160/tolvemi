# LPTL v1 処理系の信頼境界（設計書 §11.3）
#
# この版は V1-A（外部 BigInt を信頼仮定とする版）に相当する。受理・拒否の判定と実行
# （字句・構文・整形・名前解決・型検査・入力 JSON の復号・評価・出力 encode）は Verus で検証した
# 部品が行うが、spec 層の人手レビュー、診断、資源上限、接着部分が未検証で、BigInt を信頼しているので、
# 処理系全体を「完全に形式検証済み」とは呼ばない。

version = "V1-A"
spec = "spec/lptl-v1/LPTL_design_v1.md"

[spec_review]
# spec 層が設計書の意味論を正しく写しているかは人手レビューに依る。
status = "unreviewed"
files = [
  "verus/src/spec.rs",
  "verus/src/syntax.rs",
  "verus/src/resolve.rs（spec 部分：rx、resolve）",
  "verus/src/input.rs",
  "verus/src/json.rs（enc）",
]
notes = [
  "名前は name phase で解決済みとし、変数と binder は nat、関数は添字で表す",
  "呼出しグラフの DAG 性はランク証明書 Prog::rank と型付け条件 rank[callee] < rank[caller] で表す",
  "v1.7：Prog::rec（関数ごとの rec の印）。印のある関数への呼出しはランクの条件を免除する。印の列は未検証の接着部分が作る（落とせば拒否、余計に付ければ停止の保証を失うだけ）",
  "資源上限（steps、AllocatedNodes、IntegerBits）は spec 層に含まない。燃料は停止性のための抽象",
  "出力の正準 JSON は json.rs の enc で定める",
  "表面構文は syntax.rs の lex（字句）と parse（EBNF、式と型の入れ子の深さ上限つき）で、正準整形は fds で定める",
  "名前規則（関数名の一意性、変数の scope、shadowing と fold binder 重複の拒否、entry の存在と一引数）は resolve.rs の resolve で定める",
  "入力 JSON は input.rs の jparse（strict JSON、構造の入れ子の深さ上限つき）と jd（値 JSON）で定める。文字列は Unicode scalar 値の列として読み、対にならない surrogate は拒否する",
  "入力の資源上限（値の深さ・node 数・整数の桁数）は spec に含まない",
  "v1.2：文字はスカラー値（scalar）で、Val::Char の型付けがそれを含む。String は List<Char> で、型の綴りは String だけ（pt が List<Char> を拒否）。文字列リテラルは名前解決で文字のリストの式になる（str_exprs）",
]

[verus]
version = "0.2026.10.06.6b6b296"
rust_toolchain = "1.98.1-x86_64-unknown-linux-gnu"
smt = "z3 4.16.0"
command = "cd verus && cargo verus focus -- --triggers-mode silent"
result = "667 verified, 0 errors（2026-10-15、コンテナの 0.2026.10.07.89f8d65 build で確認。上の version の pin では再確認していない）"
assume = []
admit = []
# external_body は信頼する多倍長整数の演算だけ（下の [bigint]）
external_body = ["verus/src/bigint.rs"]
unsafe = []

[bigint]
# V1-A の信頼仮定：num-bigint の各演算が bigint.rs の ensures を満たす。
file = "verus/src/bigint.rs"
library = "num-bigint 0.4"
trusted = [
  "from_u64、copy、add、sub、mul、neg、lt、le、eq、is_positive の数学的意味",
  "mod_pos：正の除数に対する床剰余（= Euclid 剰余）",
  "div_pos：正の除数に対する床除算の商（= Euclid 商。v1.8 の div。num-integer の div_floor）",
  "to_dec、to_dec_chars：to_string が正準十進表記 int_dec を返すこと",
  "bits：IntegerBits 上限の判定にだけ使い、証明には現れない",
  "to_u32：値が 0〜u32::MAX なら Some（v1.2 の char(n) と入力の文字の復号で、スカラー値の範囲判定の前に使う）",
]

[proved]
# §11.2 の証明義務のうち機械証明したもの
"1.parser" = "parse_proof::parse_sound, parse_complete, toks_unique（spec の lex・parse に対する健全性・完全性・非曖昧性）。surface::lex_e、parse_e は spec と一致"
"2.formatter" = "parse_proof::format_preserves（parse(fds(p)) == Some(p)）、format_idempotent（再 parse・再整形・token 列の一致）。surface::format_e は spec と一致"
"3.resolver" = "resolve::resolve（関数名の一意性、entry の存在と一引数、変数の scope）、resolve::rx_scoped（解決後の変数は scope 内）。resolve_e は spec と一致"
"4.typechecker" = "check::ty_of は spec の ty_expr と一致する型を返す。builtin_ty は builtin_type と一致する"
"4.builtin-soundness" = "proof::apply_sound（組込みの型規則と意味の整合）"
"5.dag" = "check::check_prog が真なら wf。wf は呼出し先のランクが真に小さいか呼出し先に rec の印があることを含む（ランク列と印は未検証の接着部分が作るが、ここで検査する）"
"6.type-safety" = "proof::total, proof::entry_total（no_rec のとき）。proof::sound, sound_args, sound_fold, entry_sound（型保存：ある燃料で値が出ればその値は型を持つ。rec があっても成り立つ）"
"6.termination" = "proof::entry_total（整形式で no_rec のプログラムの entry はある燃料で Done になる）"
"6.determinism" = "proof::eval_deterministic, proof::entry_deterministic"
"6.central" = "pipeline::run_checked（返した値は spec の唯一の結果で、出力型を持つ。整形式のすべてのプログラムで。Fault にならないことは no_rec のときだけ）"
"7.fuel-monotonicity" = "proof::mono, proof::mono_args, proof::mono_fold"
"8.refinement" = "eval::Machine::eval が値を返せば spec でも同じ値に評価される（evals_to）。Fault を返すのは spec が行き詰まる（bigstep::fails）ときだけで、run_checked は整形式で no_rec のプログラムと型の合う入力で Fault にならないことを保証する。exec 評価器の停止性も Verus が検査"
"9.output" = "json::encode は spec の enc どおり。json::roundtrip で dec(enc(v)) == v、json::dec_typed で復号値は型を持つ"
"9.input" = "input_proof::input_typed（復号した値は型を持つ）、input_nodup（受理した JSON に重複キーは無い）、input_roundtrip（型付き値の正準 JSON は受理されて元の値に戻る）。input_exec::jparse_e、decode_input_e は spec と一致"
"10.failure-separation" = "pipeline::compile_source は構文・名前・型の拒否を分け、構文で拒否するのは spec の parse が None のときだけ。pipeline::run_input_json は復号の拒否（spec の input_val が None のときだけ）と実行を分け、no_rec なら実行は Fault で終わらない"
"mod" = "proof::mod_bounds（正の除数で 0 <= x mod y < y）"
"non-vacuity" = "proof::example_wf（wf が充足可能な具体例）"

[unproved]
# 未証明のもの（回帰テストと、検証済み部品との突き合わせ・差分テストでのみ確認）
"spec-review" = "spec 層が設計書を正しく写していること（上の [spec_review]）"
"diagnostics" = "診断を出す lexer・parser・検査器・入力復号器（コード、span、段階順、recovery、repair、--human の表示）。受理・拒否は検証済み部品と突き合わせ、食い違えば E-INTERNAL-VERIFIED-MISMATCH で拒否する"
"resource-limits" = "StaticProfile、InputAdmission（値の深さ・node 数・桁数）、出力 bytes の判定。評価器の step・割当・bit 長は検証済み評価器の中で数えるが、上限での打ち切りの正しさは spec に含まない"
"completeness" = "整形式のプログラムを check_prog が必ず受理すること、Tarjan 実装が正しいランクを作ること"
"10.envelopes" = "検証済み部品の結果を Compile / Decode / Run の envelope に写す接着（crates/tlvm の api.rs、values.rs、evaluator.rs）"

[exec]
verified = [
  "verus/src/surface.rs",
  "verus/src/resolve.rs",
  "verus/src/check.rs",
  "verus/src/eval.rs",
  "verus/src/input_exec.rs",
  "verus/src/json.rs",
  "verus/src/pipeline.rs",
  "verus/src/io.rs",
]
unverified = ["crates/tlvm"]
glue = [
  "crates/tlvm/src/api.rs：source の UTF-8 から文字列への変換（chars().collect()）、検証済み部品との突き合わせ、compile_ast の AST 整形（tlvm の format_program）",
  "crates/tlvm/src/values.rs：入力の UTF-8 から文字列への変換、型の変換（verified_ty）、検証済み復号器との突き合わせ",
  "crates/tlvm/src/evaluator.rs：実行結果を RunResult の envelope に写す、入力整数の bit 長の事前検査",
  "crates/tlvm/src/main.rs：fmt で検証済み formatter の出力を tlvm の整形と突き合わせる",
  "crates/tlvm/src/plain.rs：普通の JSON と値 JSON の相互変換（設計書の外側の便宜。変換後の値 JSON は検証済みの復号器で読む）",
  "crates/tlvm/src/main.rs：tlvm test の期待値との照合（出力の正準 JSON の文字列比較）",
  "crates/tlvm/src/records.rs：v1.1 のレコード型の展開（pair の入れ子と fst／snd への書き換え。検証済み部品は書き換え後の整形ソースを検査・実行する）",
  "crates/tlvm/src/runtime.rs、main.rs の exec：v1.3 の tlvm exec。entry の入力型から渡すもの（標準入力・引数）を選び、標準入力の UTF-8 を検査し、検証済みの io（テキストと値の変換）と run_checked で実行し、出力の文字の番号を文字にして書く。終了コードへの写像",
  "crates/tlvm/src/lines.rs、runtime.rs、main.rs の exec：v1.13 の辞書の入力（entry の入力型 Dict<String, String> または Dict<String, Int>）。標準入力を UTF-8 の行に分け（改行で区切り、行末の CR を一つ取り、長さ 0 の行は読まない）、各行の最初の TAB より前を鍵・後を値として、鍵が空でないこと、値に TAB がないこと、Int の値が正規の表記であることを検査し、普通の JSON の配列 [[\"鍵\",\"値\"], ...] を作る。行の誤りは InputBoundaryFailure（行番号つき）で拒否する。その JSON は run --plain と同じ api::decode_plain_input（plain.rs の対応表、診断付きの復号器と検証済みの復号器の突き合わせ、鍵の重複の拒否、資源上限）で読み、検証済みの decode_input_e で値にして run_checked に渡す。診断の span を、生成した JSON の bytes から標準入力のもとの行の範囲に直す写像と、行の形の検査、JSON の作り方は検証されていない。作り方が誤って鍵と値を取り違えれば、意図と違う辞書を実行することになり保証の外（検査・実行されるのは作った辞書の値そのもの）",
  "crates/tlvm/src/softnames.rs：tlvm ast と encode_ast が、字句表の語を変数名に使ったプログラムを E-AST-IDENTIFIER で拒否する検査（検証されていない。誤って通しても、AST transport の decoder が同じ名前を拒否するので、受理の判定は変わらない）",
  "crates/tlvm/src/main.rs：レコードを含むプログラムの fmt（診断用 formatter の出力をそのまま出す）",
  "crates/tlvm/src/recursive.rs：v1.14 の再帰する直和型の書き換え（項を長さの前置きつきの整数の列 List<Int> に符号化し、構築を補助関数の呼び出しに、match を番号による if の連鎖に、項の取り出しを rec_at・rec_take・rec_drop の呼び出しに書き換える。実行する写し（印なし）の型は List<Int> になる。型の区別は、印つきの写し（再帰する型の値に型ごとの印を付けた同じプログラム）を検証済み部品が検査して判定する。検証済み部品は書き換え後の整形ソースを検査・実行する。補助関数は LPTL の関数として型検査を通す。型エラーの文面で印の型を型の名前に直すのも接着部分である）。直和型と同じく、書き換えの誤りは検証済み部品の受理・実行の結果として現れるが、符号化の誤りは型検査では見つからない（既知の制限）",
  "crates/tlvm/src/nominal.rs、checker.rs、api.rs：v1.15 の名義の型。宣言の番号 r ごとの印（Pair<Unit, Unit> を r 段入れ子にした値）を、検査用の写し（印つき）の型 Pair<印, 展開後の構造> に付け、構築を `<名前>_wrap(x) = pair(印, x)` の呼び出しにする。field の参照と match は印つきの型のまま検査し（checker.rs は印の後ろの構造で field と枝を数える）、検証済み部品へ渡す前に印を外す（snd の挿入）。checker.rs は名義の型に fst・snd を使わせない（E-TYPE-FST-ARG、E-TYPE-SND-ARG）。検証済み部品は印つきの写しを検査し、拒否ならその診断を返す（拒否の判定は検証済み部品が行う）。受理なら印なしの写しを検査して実行する。印の番号（Tags::of）の誤り、たとえば二つの宣言に同じ番号を付ければ、検証済み部品は名義の区別を見落として混ぜた値を受理する（区別の保証の外。実行は印なしの写しで、構造として型に合う値だけが実行される）。型エラーの文面で印の型を宣言の名前に直すのは接着部分（api.rs の show_names。受理の判定には使わない）。",
  "crates/tlvm/src/sums.rs：v1.4 のユーザー定義の直和型と match の展開（ok／err の入れ子、match_result／match_option と fst／snd の let への書き換え、網羅性の検査。検証済み部品は書き換え後の整形ソースを検査・実行する）。直和型・match を含むプログラムの fmt も診断用 formatter の出力をそのまま出す",
  "crates/tlvm/src/hof.rs：v1.5 の map・filter・any・all・find・sort_by の書き換え（型検査の後に fold・reverse・cons・if・match_option・let の組み合わせへ。sort_by は fold による安定な挿入整列。検証済み部品は書き換え後の整形ソースを検査・実行する）。これを含むプログラムの fmt も診断用 formatter の出力をそのまま出す。api.rs は、検証済みの構文規則では普通の名前であるこの 6 語が呼び出し・宣言の名前の位置にあるとき、構文・名前の誤拒否の突き合わせを省く。v1.6 の loop も同じ（range(0, max) 上の fold と match_result・match_option に書き換える。状態は Result<S, S>）",
  "crates/tlvm/src/dict.rs、hof.rs：v1.9 の辞書 Dict<K, V> の書き換え（型検査の後に dict_get などの操作を fold・eq・reverse・cons・let の組み合わせへ、型の Dict<K, V> を List<Pair<K, V>> へ。挿入順で鍵が相異なる列を各操作が保つ。検証済み部品は書き換え後の整形ソースを検査・実行する）。辞書を含むプログラムの fmt も診断用 formatter の出力をそのまま出す。api.rs は dict と dict_get などが呼び出し・宣言の名前の位置にあるとき、構文・名前の誤拒否の突き合わせを省く。values.rs と plain.rs は入力の辞書の鍵の重複を拒否する（E-INPUT-DICT-DUPLICATE-KEY。検証済みの復号器は List<Pair<K, V>> として受理するので、この拒否は突き合わせない）",
  "crates/tlvm/src/generics.rs、records.rs、sums.rs、checker.rs：v1.10 の型引数（総称の関数・レコード型・直和型）。generics.rs が型引数を解決し、records.rs・sums.rs が総称の型の使用を型引数を置き換えた構造に展開し（型引数を推論する構築は展開で作る総称の関数の呼び出しにする）、checker.rs が総称の本体を型引数を不透明な型として検査して呼び出しごとの型引数を記録し、generics.rs が多相再帰を拒否して単相化する（使われた型引数の組ごとに複製。名前は重ならない名前、rec の印は複製に移る。複製 256 個・型引数 256 node まで）。単相化したプログラムを再検査し、検証済み部品は単相化・書き換え後の整形ソースを検査・実行する。単相化の誤りは検証済み型検査が拒否するか（E-INTERNAL-VERIFIED-MISMATCH）、複製元と違う本体を実行するかで、後者は保証の外。総称を含むプログラムの fmt も診断用 formatter の出力をそのまま出す",
  "crates/tlvm/src/packages.rs、imports.rs：v1.16 のパッケージ（ローカルの依存）。tlvm.json（厳格な JSON。鍵・値の形、名前と版の形、依存の path を検査する）を読み、`@名前/パス` の import を、ファイルの属するパッケージ（そのディレクトリから上へ最初に見つかる tlvm.json）の宣言した依存のディレクトリの中のファイルに結びつける。依存のマニフェストは使われたときに一度読み、名前と固定した版を照合する。解決の結果はつないだ一つの source（v1.11 と同じ）で、検証済み部品はそれを検査・実行する。依存の取り違え（ほかのディレクトリを読むこと）は検証の外で、読んだ依存の中身は検査・実行される source そのものになる。マニフェストの読み方と診断の位置の写像も検証されていない。",
  "crates/tlvm/src/imports.rs、parser.rs、api.rs、main.rs：v1.11 の import。診断用 parser が先頭の import \"path.tlvm\" を読み、imports.rs がパスを根のファイルのディレクトリからの正規形の相対パスに解決して（絶対パス・上への ..・.tlvm 以外を拒否。CLI の FsLoader は symlink で外を指すものも読まない）各ファイルを一度ずつ読み、循環・欠落・ファイル間の名前の衝突・ファイル数と bytes の合計の上限を検査し、依存されるものが先の順に一つの source へつなぐ（import の行と根以外の entry を同じ長さの空白にする）。検証済み部品はつないだ source から作った整形ソースを検査・実行する。つなぎ方の誤り（ファイルの読み落とし・余計な読み込み・別の順）は、検証済み部品が検査する一つのプログラムが意図したものと違うことになり保証の外（検査・実行されるのはつないだプログラムそのもの）。診断の span をファイルの中の位置に戻し file を付ける写像も検証されていない",
  "crates/tlvm/src/repl.rs、lsp.rs、main.rs：v1.12 の tlvm repl と tlvm lsp（検証されていない front-end）。repl.rs はセッションの import と宣言の source に、式を本体とする __repl_main（入力 Unit）と entry を付けた一つのプログラムを組み立てて、今までの imports::compile_root と api::run（tlvm run と同じ資源プロファイル）で検査・実行し、値を plain JSON で表示する。戻り型は Unit で検査したときの E-TYPE-RETURN の actual（本体がレコードの構築ならその型の名前を先に）を型として読み直して決め、読み直した型での検査が受理したものだけを使う。組み立て方の誤り（宣言の取り違え・置き換え・別の戻り型）は、意図と違うプログラムを検査・実行することになり保証の外（検査・実行されるのは組み立てたプログラムそのもの）。診断の位置を入力・ファイル・セッションの宣言に戻す写像も検証されていない。lsp.rs は JSON-RPC の区切りと応答の組み立て、開いている文書を先に読む import の loader、診断の span から LSP の range（行と UTF-16 の列）への写像、import したファイルの診断を根の import の行に置くこと、tlvm fmt と同じ整形の全文の edit を行う。判定そのものは今までの経路で、これらの写像と表示は検証されていない",
