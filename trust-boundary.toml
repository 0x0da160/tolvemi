  "crates/tlvm/src/parser.rs、checker.rs、api.rs：v1.7 の rec fn。診断用 parser が印 rec を読み（span を記録）、checker.rs が印のある関数へ入る辺を除いた呼出しグラフでランクを作る（印のない呼出し先は rank[callee] < rank[caller]）。api.rs は検証済み parser・formatter に渡すテキストから印を外し（source は印の span を同じ長さの空白に置き換え、書き換え後・AST のプログラムは印を外して整形）、関数ごとの印の列を検証済みプログラムの関数と同じ宣言順で compile_source に渡す。印を落とせば検証済み型検査が循環として拒否し（E-INTERNAL-VERIFIED-MISMATCH）、余計に付ければ停止の保証の主張（tlvm check の terminates）を誤るだけで、返した値の型と一意性の保証は残る。terminates は印のある関数がないときだけ true",
  "crates/tlvm/src/intern.rs、syntax.rs の Ty::make、checker.rs の equal：v1.12 の型の正準化（TypeSharing::Interned のとき、型検査の一回の実行の中で構造の同じ型を一つの node にし、比較 cache の鍵の address を共有させる）。鍵は構成子・子の node の address・名前の印の address・型引数の名前の完全一致で定め、表は実行の終わりに捨てる。論理イベント列・仕事量・cutoff・診断・型が Off と同じことを tests/sharing.rs と counting.rs の差分テストで確かめた。計数の誤りは検証されていない（受理・拒否は検証済み部品と突き合わせる）",
