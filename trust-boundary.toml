.2026.10.06）の pin では再確認していない）"
assume = []
admit = []
# external_body は信頼する多倍長整数の演算だけ（下の [bigint]）
external_body = ["verus/src/bigint.rs"]
unsafe = []

[bigint]
# V1-A の信頼仮定：num-bigint の各演算が bigint.rs の ensures を満たす。
file = "verus/src/bigint.rs"
library = "num-bigint 0.4"
trusted = [
  "from_u64、copy、add、sub、mul、neg、lt、le、eq、is_positive の数学的意味",
  "mod_pos：正の除数に対する床剰余（= Euclid 剰余）",
  "div_pos：正の除数に対する床除算の商（= Euclid 商。v1.8 の div。num-integer の div_floor）",
  "to_dec、to_dec_chars：to_string が正準十進表記 int_dec を返すこと",
  "bits：IntegerBits 上限の判定にだけ使い、証明には現れない",
  "to_u32：値が 0〜u32::MAX なら Some（v1.2 の char(n) と入力の文字の復号で、スカラー値の範囲判定の前に使う）",
]

[proved]
# §11.2 の証明義務のうち機械証明したもの
"1.parser" = "parse_proof::parse_sound, parse_complete, toks_unique（spec の lex・parse に対する健全性・完全性・非曖昧性）。surface::lex_e、parse_e は spec と一致"
"2.formatter" = "parse_proof::format_preserves（parse(fds(p)) == Some(p)）、format_idempotent（再 parse・再整形・token 列の一致）。surface::format_e は spec と一致"
"3.resolver" = "resolve::resolve（関数名の一意性、entry の存在と一引数、変数の scope）、resolve::rx_scoped（解決後の変数は scope 内）。resolve_e と resolve_tagged_e は spec の resolve_t と一致（resolve.rs:4821、4832。直和型を含むプログラムを含む）。S2a：型の表（resolve::decl_table、tb_push。型名と字段名の一意性、宣言の中の字段の型と直和型の中身は前の型だけ。decl_table_mono、decl_table_entry）。S2b：番号（nums_of、decl_nums。型の宣言の番号は表の位置。num_position、num_distinct）。S3a：記録の式と字段の持ち主（rec_expr、owner_pos、fld_chain）。S3b：印つきの字段の持ち主（owner_at、fld_chain_t）"
"4.typechecker" = "check::ty_of は spec の ty_expr と一致する型を返す。builtin_ty は builtin_type と一致する"
"4.builtin-soundness" = "proof::apply_sound（組込みの型規則と意味の整合）"
"5.dag" = "check::check_prog が真なら wf。wf は呼出し先のランクが真に小さいか呼出し先に rec の印があることを含む（ランク列と印は未検証の接着部分が作るが、ここで検査する）"
"6.type-safety" = "proof::total, proof::entry_total（no_rec のとき）。proof::sound, sound_args, sound_fold, entry_sound（型保存：ある燃料で値が出ればその値は型を持つ。rec があっても成り立つ）"
"6.termination" = "proof::entry_total（整形式で no_rec のプログラムの entry はある燃料で Done になる）"
"6.determinism" = "proof::eval_deterministic, proof::entry_deterministic"
"6.central" = "pipeline::run_checked（返した値は spec の唯一の結果で、出力型を持つ。整形式のすべてのプログラムで。Fault にならないことは no_rec のときだけ）"
"7.fuel-monotonicity" = "proof::mono, proof::mono_args, proof::mono_fold"
"8.refinement" = "eval::Machine::eval が値を返せば spec でも同じ値に評価される（evals_to）。Fault を返すのは spec が行き詰まる（bigstep::fails）ときだけで、run_checked は整形式で no_rec のプログラムと型の合う入力で Fault にならないことを保証する。exec 評価器の停止性も Verus が検査"
"9.output" = "json::encode は spec の enc どおり。json::roundtrip で dec(enc(v)) == v、json::dec_typed で復号値は型を持つ"
"9.input" = "input_proof::input_typed（復号した値は消去後の型 derase(t) を持つ。辞書は List<Pair<K, V>> として型を持つ）、input_nodup（受理した JSON に重複キーは無い）、input_roundtrip（型付き値の正準 JSON は受理されて元の値に戻る。辞書の型には及ばない）。input_exec::jparse_e、decode_input_e は spec と一致"
"9.input-dict" = "input::jd の Dict 枝：辞書の項を対のリストとして読み、受理は鍵の正準 JSON（enc）が相異なるときだけ（(i)。spec の jd の Dict 枝の定義と、exec の jd_e の事後条件で示す）。鍵が相異なるかの検査（exec の distinct_e）は、鍵を辞書式順序に併合整列し（keysort::sort_keys_e）、隣り合う二つを比べる。整列した並べ替えでは、隣り合う二つが異なることと、どの二つも異なることが同じなので（keysort::sorted_perm_distinct）、distinct_e の事後条件 r == distinct(vks(ks@)) で示す。input_proof::input_dupfirst_rejects：入力の最初の誤りが辞書の重複鍵（dupfirst）なら、検証済みの復号器は拒否する（(ii) の拒否の部分）。input_exec::decode_input_dupfirst_e は spec の input_dupfirst と一致（nodup_e、dupfirst_e、jparse_e も spec と一致）。受理した値は項の対のリストで、項の順に並ぶ（input_proof::dict_items_order、(iii)）。最初の誤りの順（形の検査、対の左右の順、項の順、鍵の検査の位置）は values.rs の値の DFS を写した dupfirst で、写しの一致は人手の照合と cross_check の実行時の突き合わせによる（機械証明ではない）。重複鍵の符号 E-INPUT-DICT-DUPLICATE-KEY の付与は values.rs（(ii) の符号の部分は突き合わせ）。診断の span と act は証明の外"
"10.failure-separation" = "pipeline::compile_source は構文・名前・型の拒否を分け、構文で拒否するのは spec の parse が None のときだけ。pipeline::run_input_json は復号の拒否（spec の input_val が None のときだけ）と実行を分け、no_rec なら実行は Fault で終わらない"
"mod" = "proof::mod_bounds（正の除数で 0 <= x mod y < y）"
"non-vacuity" = "proof::example_wf（wf が充足可能な具体例）"
"3.tagged-names（S3d）" = "tagged_names.rs：T1 named_entry（記録の項目の印つきの写しは Pair<tag(k), Body_k>）、T2 tag_heads_differ（番号が違えば印の頭は違う）、T3 apart_differ（一か所の名義（番号が違う）だけで違う二つの型は、印つきの写しも違う）、T4 call_rejects（その二つの型を引数と仮引数にする呼出しは、型の規則で拒否される）。表が nominal.rs の表と同じことは証明していない（テスト V3、S3c で確かめる）。印なしの解決は変えていない（resolve.rs 不変）"
"4.records-meaning（S4a、S4b）" = "records_meaning.rs の rmean（源の記録の意味。名前の位置、字段の対応、構築・参照・更新、欠けた・未知の・重複した字段は None）。records_commute.rs の resolve_sound（部分正しさ、前向き、印なし）：印なしの rx が返す核の式は、rsrc が写す源の式の意味が値 v を持つとき vof(v) に評価される。記録と名前の式（Int、Bool、Unit、文字、文字列、リスト、fold、組込み、呼出し、Option の none と some、変数、pair、字段の参照、記録の構築、if、let、Option の match）だけを扱い、他の式は定理の外（rsrc が None）。呼出しの源の意味は、呼出し先の本体を位置で書いたものを深さ dep まで埋め込んだ式（RExpr::Call）で、引数の値を位置 0、1、… に束縛して評価する（核の bind と同じ）。深さで止まらない rec の関数（循環する呼出し）は rsrc が None になり、定理は何も述べない。組込みの意味は核の apply を引数の源の値の写しに当てたもので、定義は核と共有する（源の側で定義し直さない）。逆向き（核が評価すれば源も同じ値）、型付け、印つきは証明していない"
"2.stage2-route" = "段階 2 と段階 3 の経路（記録と名前、範囲の内の直和型。S5b の後の凍結の主張。範囲は api.rs の route_scope）：(1) 受理したプログラムは、印つきと印なしの両方の写しが検証済みの解析・解決・型検査を通る（compile_source の ensures の wf、pipeline.rs:236。api.rs:876–917）。(2) 実行するのは印なしの写しの IR（api.rs:909–910）で、その意味は源の意味に等しい。ただし S4b の範囲（記録と名前の式と文字と Option（none と some、その match）と if と let と文字列とリストと fold と組込みと呼出し、前向き）と、直和型の構築と match（sum-match-chain の resolve_sound の直和型の腕、前向き）に限る。呼出しは、呼出し先の本体を深さ dep まで埋め込んだ源の意味で測り、どの深さでも、源の意味が値 v を持つなら IR は v に評価される。rec の関数（再帰）を含むプログラムは、埋め込みが深さで止まらず源の意味が定まらないので、その一致は主張しない（未証明）。この範囲の外の式の解決の一致は証明していない。(3) 名義の区別は検証済みの核が判定する。番号は検証済みの表の位置（resolve.rs:490–493、S2b、S3d）。Tags::of との一致は証明せず、テスト V3 と S3c で確かめる。(4) 字段の持ち主（どの宣言の字段か）は検証済み（S3a の owner_pos、S3b の owner_at）。別の宣言の字段への参照は、印つきの写しの型検査が拒否するので、経路は受理しない（字段の型も、この型検査が検査する）。ゲートの診断 E-TYPE-FIELD-ACCESS（checker.rs:1008–1047）は未証明で、ゲートが拒否したプログラムは検証済み部品が見ない。(5) 名義の型への fst・snd は核では Pair として通るので、拒否はゲート（checker.rs:1602–1608）。(4) と (5) のゲートの判定は、凍結の主張に含める（G3。オーナーが 2026-10-20 に決めた）。ゲートの診断そのものは未証明の信頼。(6) 手で組んだ印の形は主張しない（v1.15 §5）。(7) 名前の診断の符号と位置は信頼。展開段階の名前の 8 符号（api.rs:756–765）だけ、検証済みの解決器が受理するかどうかを突き合わせる。符号は比べない（api.rs:546–547）。(8) 総称、再帰する型、Dict、hof、loop を含むプログラムは、この凍結の外（glue の経路）。直和型を含むプログラムは、範囲の内なら経路で検査する（2026-10-28）。範囲の外は、Option と Result の枝、`_` を二つ束縛する枝、枝の並びの後ろの `,` で、信頼側の判定だけが働く。記録と直和型を混ぜたプログラムは範囲の内で、混ぜた形のための補題は足していない（resolve_sound は表の形によらない。V14 が検証済みの出力と HEAD の出力を比べる）。枝の並びの後ろの `,` は、検証済みの構文器が読まない（仕様は許す。構文器を仕様に揃える作業は未了）。末尾のコンマの記録の式は、構文器が拒否する（2026-10-20）。印の消去（S4c）は証明していない(9) hof を含み範囲内（記録・直和型・再帰・総称・Dict・loop を含まない）のプログラムは、源の文字列を検証済みの経路（hofroute.rs と api.rs の verified_from_source_hof）に通し、その IR を実行に使う。その核の意味が源の意味に等しいことは未証明なので、この凍結の主張には含めない（(8) のまま）。"
"hof-types-sh1" = "verus/src/hof_types.rs の HofTypes（checker.rs の HofTypes の写し）は、検証済みの型付け規則と一致する：hof_agree.rs の hof_agrees・hof_rw_agrees、loop_types.rs の loop_rw_agrees・loop_rw_note、dict_types.rs の dict_rw_agrees。表は全域（hof_total.rs の hof_entry_total・entries_total）。写しと checker.rs の表が同じことは機械証明ではなく、crates/tlvm/tests/hof_types.rs が表を同じ内容のデータとして比べて確かめる（[unproved] の hof-types-sh1-trust）（SH1、DECISION-38）"
"rewrite-spec-hof" = "verus/src/hofrw.rs の写し rw_tb（源の式 XExpr から核の式 Expr へ。hof の束縛名 x ごとの三つ組（x、要素の型 A、本体の型 B）を表 tb から引く。map の空の列の注釈は B、他の形は A（Rust の hof.rs の lower と同じ））は、homomorphic と hof_shapes を満たす（tb_homomorphic、tb_hof_shapes、形ごとの tb_map_shape・tb_filter_shape・tb_any_shape・tb_all_shape・tb_find_shape・tb_sort_shape）。導入する名前は hof_base（束縛名と本体の写しの名前より大きい）で、その新しさは top（fresh.rs）と below_absent から示す。したがって、写しを rw_tb(tb) とすれば、SH4・SH6 の定理の hof の形の仮定は、この写しについて証明済みである。残る接着は [unproved] の rewrite-shape に挙げた三つ。"
"rewrite-exec-hof" = "verus/src/hofex.rs の exec の書換え rw_ex（源の exec の式 EX から核の exec の式 EExpr へ。表は束縛名、要素の型、本体の型の三つ組の列 Vec<(usize, Ty, Ty)>）：rw_ex が Some を返すなら、その写し view_expr(v) は spec の rw_tb(view_tb(tb), view_ex(e)) に等しい（rw_ex の事後条件）。None は名前の加算の桁あふれだけで、呼出し側は書換えの拒否として扱う。部品の事後条件は、top_e が top、hof_base_x が hof_base、ent_e が hof_ann と hof_body、erase_x が erase_ty、add_e が検査つきの加算、各構成子の組立て（var_x から sort_collect_x まで）が spec の形と一致する。信頼するのは bigint の Int::copy（事後条件 r@ == self@。[bigint]）と vstd の Vec（[libraries]）だけ。EX と Rust の AST との変換は含まない（[unproved] の rewrite-shape の (1)）。"
"rewrite-exec-dict" = "verus/src/dictex.rs の exec の書換え dict_rw_x（辞書の操作 op の被演算子 a0・a1・a2 と、注釈の型 k・v から、dict_types.rs の核の写し dict_rw を組み立てる）：Some を返すなら、その写し view_expr(out) は spec の dict_rw(op, dict_args(op, view a0, view a1, view a2), k, v, fresh_ns(dict_top(…), dict_names(op))) に等しい（dict_rw_x の事後条件）。導入する名前は被演算子の名前の上限の次から取るので、名前の条件 dict_fresh は dict_fresh_ns が示す（被演算子の名前は上限より小さい。fresh_absent）。dict_rw_fresh_agrees は、被演算子が項目の型 ts を持つとき、その書換えが形の型の消去を持つことを示す（dict_rw_agrees の適用）。None は名前の加算の桁あふれだけで、呼出し側は書換えの拒否として扱う。部品の事後条件は、entry_x・put_rw_x・scan_rw_x が spec の pair_e・put_rw・scan_rw の形と一致することである。信頼するのは hofex.rs の top_e と max_o（検証済み。vstd の Vec を使う。[libraries]）だけ。k・v の消去（erase_x）、dict.rs の書換えとの接着（[unproved] の rewrite-shape の (3)）、辞書の操作の意味（xsem に辞書の形はない）は含まない。"
"nominal-tag-exec" = "verus/src/resolve.rs の tag_ty_e と tag_expr_e（印の型と印の式の exec 版）：tag_ty_e(k) は spec の tag_ty(k) に等しく、view_expr(tag_expr_e(k)) は spec の tag_expr(k) に等しい（ensures）。crates/tlvm/src/nominal.rs の tag_ty と tag_val はこの exec 版を呼び、Unit と Pair だけの木として写す（verified_tag_ty・verified_tag_val）。写す接着は証明していない。テスト nominal::tests は、この版を使う前の Rust の構成と、印の型と値が一致することを確かめる。印の番号（Tags::of）、named_ty、wrap_fn、is_tagged は Rust のまま（[unproved] の rewrite-shape の (3)）。"
"nominal-numbering" = "verus/src/tagged_names.rs の seen_names（名前の列の、最初に現れた順の相異なる名前）と seen_names_e（その exec 版。ensures で spec と一致）。crates/tlvm/src/nominal.rs の Tags::of は、型の宣言（レコード型と直和型）の名前を宣言の順に集め、seen_names_e が作る列での位置を番号にする（Tags::from_names。呼出しの接着は証明していない）。同じ名前の後の方は数えない、という旧い Rust の書き方と同じ番号になることは、テスト nominal::tests::numbers_follow_the_first_occurrence_of_each_name が確かめる。"
"sum-table-expansion" ="verus/src/resolve.rs の pay_ty・pay_from・sum_from・sum_exp（直和型の中身と名前表の展開。構築子の中身は、項がなければ Unit、一つならその型、複数なら右に入れ子の Pair。直和型の中身は、構築子の順に入れ子の Result。sums.rs の payload_type と chain と同じ形）と、tb_push の直和型の枝：再帰しない直和型は、印なしの展開と印つきの展開を名前表に入れる。再帰する直和型の展開は None のまま（符号化は recursive.rs）。tb_push_e（exec）は同じ表を作る（ensures）。直和型の構築子と match（SumMatch）の解決は、sum-constructor-lowering と sum-match-chain が示す（字段は何個でもよく、枝は順を問わず、末尾に _ を一つ置いてもよい。_ だけの match も含む）。直和型の意味（核の評価との一致）は、sum-match-chain と合わせた resolve_sound の直和型の腕が示す（前向き。段階 3、2026-10-28）。route（api.rs の route_scope）は範囲の直和型を含む（範囲の外は 2.stage2-route の (8)）。"
"sum-constructor-lowering" = "verus/src/resolve.rs の直和型の構築子（vent・vlook・pay_at・inj_from・ctor_val・pay_nested・rctor）と exec 版（rctor_e。その下の vlook_e・pay_at_e・inj_from_e・ctor_val_e・pay_nested_e）。字段の並びは、字段が無ければ Unit、あれば rbuild（右に入れ子にした Pair。sums.rs の payload と同じ形）にし、字段の数が構築子の項目と違えば拒否する。印なしでは Inj の鎖（構築子の番号の層）、印つきでは印の値（tag_expr）と組にする。rctor_e は spec の rctor と一致する（ensures）。rx の字段のない構築子の名前と、字段つきの呼出しの腕は、この rctor を使う。"
"sum-match-chain" = "verus/src/resolve.rs の直和型の match（arm_name・arm_ok・binds_fresh・arm_scope・binds_lets・arm_wrap・arm_find・arm_at・arm_binds_or_empty・has_wild・layer_idx・arm_layers・arms_cover・arms_fit・arms_sum・any_arms・any_top・smatch_from・smatch_top）と exec 版（arm_name_e・arm_ok_e・binds_fresh_e・push_arm_e・truncate_to_e・binds_lets_e・arm_wrap_e・arm_find_e・has_wild_e・layer_idx_e・arm_layers_e・arms_cover_e・arms_fit_e・arms_sum_e・any_arms_e・any_top_e・smatch_e・smatch_top_e・smatch_tag_e・rx_sum_e）。枝は、一つの直和型の構築子を一つずつ並べ（順は問わない）、末尾に _ を一つ置いてもよい。項目（構築子の並び）の各々に、名前が一致する最初の構築子の枝が当たり（構築子の枝がない項目には、末尾の _ が当たる）、構築子の枝は字段の数が宣言と同じで、束縛が arm_ok（字段が二つ以上なら名前は空でなく相異なる）と binds_fresh（外側の scope に無い）を満たすときだけ受理し、項目の順に Let と MatchR の鎖に写す。項目は相異なり、構築子の枝の数は、構築子の枝が当たる項目の数と同じときだけ受理する（一つの枝が二つの項目に当たることも、どの枝も使われないこともない）。_ があるときは、構築子の枝が当たらない項目が一つ以上あるときだけ受理する（_ が末尾でないときと、どの項目にも当たらない _ は、受理しない）。字段が二つ以上の枝は、中身の値の射影（rfield）で字段を束縛してから本体を解決する。印つきでは、被験式の印を検査してから中身（snd）を取り出す（tfield と同じ検査）。rx_sum_e は spec の rx と一致する（ensures）。_ だけの枝の並びは any_top が受理する（sums.rs の MatchKind::Any と同じく、被験式を束縛し、本体を空の名前の scope で解決する）。それ以外で先頭が構築子でない並びは拒否する（arms_sum が None）。拒否の符号と位置は sums.rs の診断（信頼）。枝の中の記録の式も受理し、その位置の不在は scope-distinct の absent_rec が示す。前向きの意味（rx が c を返し、rsrc が r を返し、rmean(r) が v なら、c は vof(v) に評価される）は、resolve_sound の SumMatch の腕（sum_any_arm、sum_layer_arm。構築子の並びの本体は ctor_var_arm と ctor_call_arm と call_arm）が示す。"
"scope-distinct" = "verus/src/resolve.rs の scope の相異性（dsc、distinct_dsc、dsc_push、dsc_push_empty、dsc_names、arm_scope_dsc）。字段が二つ以上の枝の scope は、中身の印（空の名前）の後に、空でなく相異なる字段の名前を並べたもので、外側の名前に無いときだけ受理する。scope は、空でない名前が相異なり、空の名前（記録の基の束縛と直和型の 0 字段の枝の束縛）は何個あってもよい。ユーザーの名前は空でないので、idx は内部の位置を引かない。空の名前がある scope の中の記録の式は、検証済みの解決器が受理する（rx の記録の腕。拒否はしない）。その腕が、位置 n（空の名前）を参照も束縛もしないことは absent_rec が示す。字段の展開と写しは rx_rec_none、rx_rec_some、rsrc_rec_none、rsrc_rec_some、rec_expr_none_upd、rec_expr_some_upd が、字段の書込みは absent_rec_upd が、基ありの更新は absent_rec_some と absent_rupdate が、基なしの構築は absent_rec_none と absent_rbuild が示す。したがって、直和型の 0 字段の枝の中の記録も、解決器は通す（範囲の直和型の枝の中の記録も、この定理で通る）。rx_scoped（rx_sum_scoped、smatch_from_scoped、smatch_top_scoped を含む）は、解決後の変数の添字が scope の中にあることを示す。"
"rewrite-exec-loop" ="verus/src/loopex.rs の exec の書換え loop_rw_x（反復 loop(init, max, |s| e) の被演算子と、注釈の型 S の消去から、loop_types.rs の核の写し loop_rw を組み立てる）：Some を返すなら、その写し view_expr(out) は spec の loop_rw(view init, view max, s, view body, S, fresh_ns(loop_top(s, max, body), 44)) に等しい（loop_rw_x の事後条件）。導入する名前（44 個）は束縛 s・max・本体の名前の上限の次から取るので、loop_names は loop_names_fresh が示す。loop_rw_fresh_agrees は、被演算子が項目の型を持つとき、その書換えが形の型 Option<S> の消去を持つことを示す（loop_rw_agrees の適用）。段の幅の 16 の冪は int_x（Int::from_u64、[bigint]）で作る。None は名前の加算の桁あふれだけで、呼出し側は書換えの拒否として扱う。部品の事後条件は、nm・int_x・inj_x・matchr_x・level_prev_x・level_list_x・loop_step_x・loop_inner_x・loop_level_x が spec の形と一致することである。信頼するのは hofex.rs の top_e と max_o、dictex.rs の fresh_ns と fresh_absent（検証済み）、bigint の Int::from_u64（[bigint]）と vstd だけ。反復の意味（xsem に反復の形がない）、注釈の型 S の消去（erase_x）、hof.rs の反復の書換えとの接着（[unproved] の rewrite-shape の (3)）は含まない。"
"hx-numbering" = "verus/src/hofres.rs の hx（源の式 Sx を、束縛の番号を計数器で振った源の式 XExpr に解決する。hof の形を含む。記録、直和型の match、loop、dict は None で経路の外）：成功したとき、束縛の番号の列 bnums は計数器の始まりから連続し（hx_consec）、次の計数器はその個数だけ進む。よって、一つの解決の中の束縛の番号はすべて相異なる（表を番号で引けることの前提）。枝ごとの補題（pair_consec、if_consec、let_consec、fold_consec、match_consec、matchr_consec、hof_consec）、列の版 hxs_consec、文字列の版 bnums_seq_chars で示す。扱わないこと：表（checker の HofTypes）の並びと束縛の番号の対応（Rust 側の接着。route_table の並びを verified_hofs と実行時に比べて検査する）、hx の結果が源の意味（xeval）に一致すること。hx の exec の版は hx-exec、プログラム単位の解決は hof-resolve で示す。"
"hx-exec" = "verus/src/hofresex.rs の hx_e（hx の exec の版。束縛の番号は計数器から取り、取るたびに room で桁あふれを確かめる）：成功したとき、結果の源の式の写し（view_ex）と次の計数器は hx に等しく、失敗は hx が None のときだけ（ensures）。範囲外（記録、直和型、loop、dict）は None。扱わないこと：hx の結果が源の意味（xeval）に一致すること、表。"
"hof-resolve" = "verus/src/hofprog.rs の hresolve_e（hof を含むプログラムの名前解決の exec 版）：結果は hresolve に等しく（ensures）、None は hresolve が None のときだけ。hresolve は、宣言が関数と entry だけで、関数の名は相異なり、entry は一つで引数は一つ、束縛の番号は関数の順に一つの計数器から取る。扱わないこと：表（HofTypes）、源の意味（xeval）との一致。"
"hof-route" = "verus/src/hofroute.rs：hof_resolve_source は源の文字列の構文器（parse_e）と hresolve_e の合成（hresolve(parse(src)) に等しい）。hof_compile は解決した関数の本体を rw_ex で書き換え、核のプログラムを check_prog で検査する。受理したなら、核の関数は解決した関数を rw_tb で写したもの（hrw_funcs）に等しく、整形式（wf）で、entry は解決の entry。扱わないこと：表の中身（HofTypes）、表の番号と解決の番号の一致（api.rs の verified_hofs との比較、実行時）。源の意味（xeval）と核の意味の一致は hof-meaning が示す。"
"hof-meaning" = "verus/src/hofmean.rs：hof_route_meaning。核のプログラム p が、解決した関数の列 fs を表 tb で写したもの（hrw_funcs。整形式）であるとき、p の意味は fs の源の意味（xeval）に等しい。示すこと：源は行き詰まらず Done を返し、核は OutOfFuel でないどの燃料の結果も源の結果に等しく、ある燃料で源の結果を返す（rw_tb が homomorphic と hof_shapes を満たすこと（hofrw.rs の tb_homomorphic・tb_hof_shapes）と、sh6_typed_same）。仮定は三つ：入力の値が入口の引数の型を持つ（Rust が入力を読む）、署名に Dict が無い（erase_ty を恒等にする。Rust の経路の範囲の dict::has_dict が型も見て確かめる）、燃料の源の結果が OutOfFuel でない。扱わないこと：hresolve が源の文字列の意味を保つこと、入力の読み込み、核の意味と Rust の実行器の一致（実行器の信頼）"
"sh4-sh6" = "書換えの意味の前向き（SH4・SH6）：simulation.rs の sim_expr と sh4_same_result、sh6_obligations.rs の sh6_ob_done（ob_map・ob_filter・ob_any・ob_all・ob_find・ob_sort_by）、sh6_stuck.rs の sh6_ob_stuck（ob_map_stuck・ob_filter_stuck・ob_find_stuck、および ob_any_stuck・ob_all_stuck・ob_sort_by_stuck）、sh6_safe.rs の sh6_source_safe・sh6_same_result・sh6_typed_same。sim_prog・homomorphic・hof_shapes（[unproved] の rewrite-shape。写し rw_tb については [proved] の rewrite-spec-hof）の下で、源の entry が燃料 n で結果 r（Done か Stuck）を返せば、書換え後も r を返し、書換え後の非 OutOfFuel の結果はすべて r に等しい。源が行き詰まる場合の一致は、any・all・sort_by を含まないプログラムか型の付いたプログラムに限る（sh6_same_result）。書換え後が整形式で入力が型を持つ型の付いたプログラムでは、源は行き詰まらず（sh6_source_safe）、源の OutOfFuel でない結果は書換え後と同じ値（sh6_typed_same）。型の付かない any・all・sort_by の行き詰まりは、filter・find と同じ形では成り立たない（any_full_fails、all_full_fails、sort_full_fails。隙間は any_gap、all_gap、sort_gap）ので、その主張は置かない。逆向きは [proved] の sh4-back が示す"
"sh4-back" = "書換えの意味の逆向き（SH4、型の付いたプログラム）：verus/src/sh4_back.rs の sh4_back_typed。sim_prog・homomorphic・hof_shapes（[unproved] の rewrite-shape。写し rw_tb については [proved] の rewrite-spec-hof）の下で、書換え後が整形式（wf）で入力が entry の引数の型を持つなら、書換え後の entry がある燃料で値 w に評価されれば、源の entry もある燃料で同じ値 w に評価される。書換えの前向き（sh4-sh6）と合わせて、型の付いたプログラムでは、源と書換え後の Done の値は一致する。証明は書換え後の燃料についての逆向きの帰納で、各形は源の燃料の閾値（xat）を返す（back_expr、fold_back、map_back、filter_back、any_back、all_back、find_back、sort_walk）。型の付かないプログラムでは成り立たない（any([()], |x| 1) は源が行き詰まり、書換え後は Int(1)。any_full_fails）。行き詰まりの逆向きは主張しない"

[unproved]
# 未証明のもの（回帰テストと、検証済み部品との突き合わせ・差分テストでのみ確認）
"spec-review" = "spec 層が設計書を正しく写していること（上の [spec_review]）"
"hof-types-sh1-trust" = "crates/tlvm/src/checker.rs の HofTypes（hof・dict・loop の書換えに使う型の表）は信頼の境界に残す（DECISION-38、2026-10-20、オーナーの「一致だけ証明」）。写し（verus/src/hof_types.rs）と表が同じことは機械証明していない。crates/tlvm/tests/hof_types.rs が、表を同じ内容のデータとして比べて確かめる。checker 自体は検証しない（一致の証明は [proved] の hof-types-sh1）"
"rewrite-shape" = "書換えの形の仮定の接着（DECISION-43：書換えを Verus で書く）。仕様の写し rw_tb（hofrw.rs、[proved] の rewrite-spec-hof）と、その exec 版 rw_ex（hofex.rs、[proved] の rewrite-exec-hof）は、hof の形（map・filter・any・all・find・sort_by）の仮定（homomorphic と hof_shapes）を満たす写しを与える。範囲内の hof を含むプログラムの実行 IR は、源の文字列を検証済みの構文器と解決器で読み、書換えと型検査を検証済みの部品で行う経路（[proved] の hof-resolve、hof-route。api.rs の verified_from_source_hof）が与える。未了は次の三つ。(1) 接着：Rust の AST（crates/tlvm の Expr）と EX・EExpr との変換（hof_verified.rs の lower_hof の写しと戻し）は、なお全ての hof の書換えで走り、書換えた文面を検証済みの型検査器に通す（cross_check）。実行の IR は範囲内では源の経路が与えるので、実行の正しさはこの接着に依らない。接着が写す文面と源の経路の核が一致することは未証明。(2) 表の対応：checker の HofTypes（node index ごと）を、束縛ごとの表 rw_ex の tb にする写し（hof_verified.rs の route_table、Conv と同じ番号づけ）。その番号と形の並びは検証済みの解決の並び（verified_hofs）と実行時に比べ、一致しなければ拒否する。表の型が源の型と一致することは HofTypes の信頼（hof-types-sh1-trust、DECISION-38）。(3) hof 以外の書換え（records、sums、recursive、generics、nominal の名前つきの型）の写しと形の仮定。nominal の印の型と印の値は、検証済みの exec 版（[proved] の nominal-tag-exec）を呼び、印の番号は検証済みの seen_names_e（[proved] の nominal-numbering）が決める（型の宣言の名前を集める部分は Rust の接着）。直和型は、名前表の展開（sum-table-expansion）と構築子・match（sum-constructor-lowering、sum-match-chain。字段は何個でもよく、枝は順を問わない）を検証済みの resolve が行うが、経路（api.rs の route_scope）は直和型を外したままなので、製品の直和型は sums.rs の展開のまま。末尾の _ の枝と _ だけの match は入った。枝の中の記録の式も入った（scope-distinct）。名前の衝突の検査（E-SUM-NAME-CONFLICT、E-SUM-DUPLICATE-CTOR。Rust の前提条件のまま）は未了。dict と loop は、写し（dict_rw、loop_rw）と exec 版（dict_rw_x は dictex.rs、loop_rw_x は loopex.rs。[proved] の rewrite-exec-dict と rewrite-exec-loop）を、dict.rs と hof.rs の書換えの代わりに呼ぶ（crates/tlvm/src/dictloop_verified.rs）。その接着（被演算子を仮の変数で渡して元の式で置き換えること、導入する名前の対応、型の写しと消去）は未証明である。従来の書換えと同じ式を作ることは、単体テストと、1069 件の corpus の書換え後の文面の比べで確かめた（検査であり証明ではない）。dict の辞書の操作と loop の反復の意味は、xsem に形がないので未了。hof の核の意味が源の意味（xeval）に等しいことは hof-meaning が示す（入力の型と署名の Dict の無さを仮定）。(1) から (3) が済むまで、この項目は未証明である。"
"diagnostics" = "診断を出す lexer・parser・検査器・入力復号器（コード、span、段階順、recovery、repair、--human の表示）。受理は検証済み部品と突き合わせ、検証済みが拒否すれば E-INTERNAL-VERIFIED-MISMATCH で拒否する。拒否は、字句・構文・名前の段階と、展開段階の 8 符号（api.rs:756–765）だけ、検証済みが受理しないかを調べる（api.rs:451、541–542）。型の拒否は調べない（片方向）。符号と位置は突き合わせない（DECISION-41：証明せず台帳に残す）"
"resource-limits" = "StaticProfile、InputAdmission（値の深さ・node 数・桁数）、出力 bytes の判定。評価器の step・割当・bit 長は検証済み評価器の中で数えるが、上限での打ち切りの正しさは spec に含まない（DECISION-41：証明せず台帳に残す）"
"resource-limits-after-lowering" = "verus/src/guards.rs（段階 0・SH7。式深さの単位は §18.1 に合わせて改めた）：書換えの後の大きさ（UTF-8 の bytes。上限を超えれば拒否。書換えのないプログラムも同じ）と式の深さ（検証済み parser の入れ子の上限 d。実装は上限 E（§18.1 の 256）で判定し、報告値は受理する最小の d）の述語を、検証済み部品の exec 関数（parse_e の ensures）と UTF-8 の模型で書き、次を証明する：大きさの判定の exact 性、parser の入力の前提（文字数 < 2^28）、報告値と超過の対応、loop だけの入れ子の数（上限 256 で 9 段まで受理、10 段から拒否）。仮定として残すもの：(1) H26（loop だけの k 段の入れ子は d >= 26k + c で受理し、c は 1 か 2。HEAD の測定では c = 2、d = 26k + 2（k = 1, 2, 3, 8〜12, 19, 20）で、診断用 parser の式の深さと同じ単位。書換え（hof::lower、dict::erase_in_place、format_program など）は未検証で、段階 4 まで仮定。if で包んだ本体には当てはまらず、そのときは d = 27k + 3）、(2) T-mono（検証済み parser の受理は d について単調。未証明）、(3) 書換えの文字列の作り方と Rust の判定（api.rs の check_rewritten_size、cross_check_at、depth_bounds、expr_depth_needed）は未検証で、guards.rs は述語だけを写す。§18.1 の式深さ 256 は検証済み parser の d と同じ単位で読む（オーナーの決定 2026-10-19 23:37）。spec/lptl-v1/LPTL_design_v1.md の例「20 段の入れ子は書換え後の深さ 260」の 260 は旧実装の半分の報告値で、同じ単位では 522（測定）。spec の例の数は 522 に直した（オーナーの承認 2026-10-20 00:11）"
"resource-counts-rewritten" = "loop・hof・dict を含むプログラムの書換えの後の Steps と AllocatedNodes の数は、仕様 §18.3 の数えと一致しない（書換えで数が変わる。例：max=1 の loop は仕様の約 460 step と違う）。超過で ResourceExhausted になる境界は、凍結の主張の外（オーナーの決定 2026-10-20、OD-9：凍結の外に置く）。凍結の主張は値と誤りまで。数えを保つ書換えは見積もっていない。"
"declaration-count-limit" = "名義の印は宣言の番号 r（0 から数える）に r 段の入れ子を使うので、宣言の数に静的な上限がある。字段が Int の平らなレコード宣言だけのとき、126 個までで、127 個目で E-LIMIT-STATIC-SEMANTIC-TYPE-DEPTH（期待 128、実際 129）。字段に他の宣言の型を使うと、より少ない個数で型の深さか書換えの大きさの上限に掛かる。静的な上限として v1.15 差分仕様 §3 と既知の注意点に書いた（オーナーの決定 2026-10-20）。テスト V12 が HEAD と同じ判定を確かめる。"
"completeness" = "整形式のプログラムを check_prog が必ず受理すること、Tarjan 実装が正しいランクを作ること（DECISION-41：証明せず台帳に残す）"
"10.envelopes" = "検証済み部品の結果を Compile / Decode / Run の envelope に写す接着（crates/tlvm の api.rs、values.rs、evaluator.rs）（DECISION-41：証明せず台帳に残す）"

[exec]
verified = [
  "verus/src/surface.rs",
  "verus/src/resolve.rs",
  "verus/src/check.rs",
  "verus/src/eval.rs",
  "verus/src/input_exec.rs",
  "verus/src/keysort.rs",
  "verus/src/json.rs",
  "verus/src/pipeline.rs",
  "verus/src/io.rs",
  "verus/src/hofex.rs",
  "verus/src/dictex.rs",
  "verus/src/loopex.rs",
]
unverified = ["crates/tlvm"]
glue = [
  "crates/tlvm/src/api.rs：source の UTF-8 から文字列への変換（chars().collect()）、検証済み部品との突き合わせ、compile_ast の AST 整形（tlvm の format_program）、入力の読みと実行 `run_input`（値 JSON と普通の JSON。復号は一度だけ。検証済みの値を同じスレッドで `evaluator::run_verified` に渡し、`run` と同じ写しで結果を返す。`run_plain_input` は普通の JSON の場合の包み）",
  "crates/tlvm/src/values.rs：入力の UTF-8 から文字列への変換、型の変換（verified_ty）、検証済み復号器との突き合わせ",
  "crates/tlvm/src/evaluator.rs：実行結果を RunResult の envelope に写す、入力整数の bit 長の事前検査、入力の評価（`run_verified`。検査で受理した検証済みの値をそのまま評価し、`run` と同じ写し。値 JSON と普通の JSON の両方）",
  "crates/tlvm/src/main.rs：fmt で検証済み formatter の出力を tlvm の整形と突き合わせる",
  "crates/tlvm/src/plain.rs：普通の JSON と値 JSON の相互変換（設計書の外側の便宜。変換後の値 JSON は検証済みの復号器で読む）",
  "crates/tlvm/src/main.rs：tlvm run と tlvm test の入力と期待値の読み（入力は `run_input` で一度だけ読んで実行し、期待値は読んでから出力の正準 JSON の文字列と比べる）",
  "crates/tlvm/src/records.rs：v1.1 のレコード型の展開（pair の入れ子と fst／snd への書き換え）。書換えの判断は検証済み（verus/src/records_plan.rs、2026-10-28）。字段の位置は place_e が records_meaning の pos を返す（pos_at、pos_none）。字段の参照の fst／snd の並びは field_steps_e が field_steps を返し、field_steps_apply でそれを当てると tfield（印つきは先頭の snd を当てた rfield）になる。構築の拒否と base の束縛の有無は record_mode_e が mode_spec を返し、mode_none_rrecord と mode_some_rrecord で rrecord の拒否と rupdate の let の規則に一致する。木の走査、型の展開、字段の名前の番号づけ、pair の組み立て、base の変数名の選択は接着のまま（検証していない）。展開はゲートで、名前の診断の符号と位置は信頼（records.rs:625–629）。記録と名前だけのプログラムの受理は、源の文字列を検証済みの経路で検査して判定し、印なしの IR を実行に使う（api.rs の route_expanded、verified_from_source。S5b）。経路の外のプログラムは、書き換え後の整形ソースを検証済み部品が検査・実行する",
  "crates/tlvm/src/runtime.rs、main.rs の exec：v1.3 の tlvm exec。entry の入力型から渡すもの（標準入力・引数）を選び、標準入力の UTF-8 を検査し、検証済みの io（テキストと値の変換）と run_checked で実行し、出力の文字の番号を文字にして書く。終了コードへの写像",
  "crates/tlvm/src/lines.rs、runtime.rs、main.rs の exec：v1.13 の辞書の入力（entry の入力型 Dict<String, String> または Dict<String, Int>）。標準入力を UTF-8 の行に分け（改行で区切り、行末の CR を一つ取り、長さ 0 の行は読まない）、各行の最初の TAB より前を鍵・後を値として、鍵が空でないこと、値に TAB がないこと、Int の値が正規の表記であることを検査し、普通の JSON の配列 [[\"鍵\",\"値\"], ...] を作る。行の誤りは InputBoundaryFailure（行番号つき）で拒否する。その JSON は run --plain と同じ api::decode_plain_keeping（decode_plain_input と同じ判定。plain.rs の対応表、診断付きの復号器と検証済みの復号器の突き合わせ、鍵の重複の拒否、資源上限）で読み、その突き合わせで検証済みの decode_input_e が作った値をそのまま run_checked に渡す（二回目の復号はしない）。診断の span を、生成した JSON の bytes から標準入力のもとの行の範囲に直す写像と、行の形の検査、JSON の作り方は検証されていない。作り方が誤って鍵と値を取り違えれば、意図と違う辞書を実行することになり保証の外（検査・実行されるのは作った辞書の値そのもの）",
  "crates/tlvm/src/softnames.rs：tlvm ast と encode_ast が、字句表の語を変数名に使ったプログラムを E-AST-IDENTIFIER で拒否する検査（検証されていない。誤って通しても、AST transport の decoder が同じ名前を拒否するので、受理の判定は変わらない）",
  "crates/tlvm/src/main.rs：レコードを含むプログラムの fmt（診断用 formatter の出力をそのまま出す）",
  "crates/tlvm/src/recursive.rs：v1.14 の再帰する直和型の書き換え（項を長さの前置きつきの整数の列 List<Int> に符号化し、構築を補助関数の呼び出しに、match を番号による if の連鎖に、項の取り出しを rec_at・rec_take・rec_drop の呼び出しに書き換える。実行する写し（印なし）の型は List<Int> になる。型の区別は、印つきの写し（再帰する型の値に型ごとの印を付けた同じプログラム）を検証済み部品が検査して判定する。検証済み部品は書き換え後の整形ソースを検査・実行する。補助関数は LPTL の関数として型検査を通す。型エラーの文面で印の型を型の名前に直すのも接着部分である）。直和型と同じく、書き換えの誤りは検証済み部品の受理・実行の結果として現れるが、符号化の誤りは型検査では見つからない（既知の制限）",
  "crates/tlvm/src/nominal.rs、checker.rs、api.rs：v1.15 の名義の型。印の型と印の値（tag_ty・tag_val）は検証済みの tag_ty_e・tag_expr_e を呼ぶ（[proved] の nominal-tag-exec。呼出しの接着は未証明）。印の番号（Tags::of）は、型の宣言の名前を宣言の順に集める部分（Rust の接着）と、最初に現れた順の位置を決める検証済みの seen_names_e を呼ぶ部分（[proved] の nominal-numbering。呼出しの接着は未証明）に分かれる。宣言の番号 r ごとの印（Pair<Unit, Unit> を r 段入れ子にした値）を、検査用の写し（印つき）の型 Pair<印, 展開後の構造> に付け、構築を `<名前>_wrap(x) = pair(印, x)` の呼び出しにする（経路の内では、検証済みの解決器が印を式の中に直接書く。S3b）。field の参照と match は印つきの型のまま検査し（checker.rs は印の後ろの構造で field と枝を数える）、検証済み部品へ渡す前に印を外す（snd の挿入）。checker.rs は名義の型に fst・snd を使わせない（E-TYPE-FST-ARG、E-TYPE-SND-ARG）。検証済み部品は印つきの写しを検査し、拒否ならその診断を返す（拒否の判定は検証済み部品が行う）。受理なら印なしの写しを検査して実行する。番号の出どころ：記録と名前だけのプログラム（経路の内）は、番号を検証済みの表の位置が作り（resolve.rs:490–493、S2b）、印つきの検査は検証済みの番号で判定する。Tags::of の番号は表示とゲートの印つきの写しにだけ使う。経路の内では Tags::of の番号の誤りで受理が広がることはなく、拒否が増えるだけになる（受理には検証済みの印つきの検査も通る必要があり、その検査は自分の番号で判定するため）。直和型と再帰する型を含むプログラムは経路の外で、印つきの写しは印なしの検査で見るだけなので、Tags::of の番号の誤り（たとえば二つの宣言に同じ番号を付ければ）は、検証済み部品が名義の区別を見落として混ぜた値を受理する（区別の保証の外。実行は印なしの写しで、構造として型に合う値だけが実行される）。手で組んだ印の形は、v1.15 §5 のとおり閉じていない。型エラーの文面で印の型を宣言の名前に直すのは接着部分（api.rs の show_names。受理の判定には使わない）。",
  "crates/tlvm/src/sums.rs：v1.4 のユーザー定義の直和型と match の展開（ok／err の入れ子、match_result／match_option と fst／snd の let への書き換え、網羅性の検査。検証済み部品は書き換え後の整形ソースを検査・実行する）。直和型・match を含むプログラムの fmt も診断用 formatter の出力をそのまま出す。検証済みの resolve は、字段の数によらず構築子と、枝の順を問わない match（末尾の _ を含む）を解決する（[proved] の sum-constructor-lowering、sum-match-chain）が、範囲の内の直和型は、源の文字列を検証済みの構文器・解決器・型検査器が読み、その IR を実行に使う（api.rs の verified_from_source）。sums.rs の展開は、信頼側の受理と診断を決める接着で、経路の判定と IR は検証済みの側が作る。範囲の外の直和型は sums.rs の展開のまま使う（範囲の判定は sums::has_unverified_arm と sums::has_trailing_arm_comma）",
  "crates/tlvm/src/hof_verified.rs：v1.5 の hof の書き換えの検証済みの経路（DECISION-43）。hof を含むプログラムで、型検査の表（HofTypes の node ごとの要素の型と本体の型）から、Rust の AST を検証済みの源の式 EX に写し（束縛ごとに番号、hof の束縛は（束縛の番号、要素の型、本体の型）の表に、文字列は引数のない呼出しで）、検証済みの rw_ex で書き換え、核の式 EExpr を Rust の AST に戻す（束縛はすべて hof の番号の新しい名前に付け直す）。写し・番号の付け方・表の作り方・戻しは検証していない（[unproved] の rewrite-shape の (1)・(2)）。書き換えた整形ソースを、api.rs の経路で検証済み部品が検査し、その生成した実行可能な IR で実行する。突き合わせは受理と拒否の別だけを比べるので、写しの誤りが型の付くプログラムを生むと、実行の結果は検証されない。写せないもの（ループ、辞書の操作、空の辞書、表に型のない hof）は hof.rs に回す。tests/hof.rs（lowered_verified、verified_lowering_keeps_string_literals）と既存の hof のテストが、実行の結果を確かめる。",
  "crates/tlvm/src/dictloop_verified.rs：v1.6 の loop と v1.9 の辞書の操作の書換え（段階 1b、DECISION-43）。被演算子を仮の変数（init・mx・body は 0・1・2、loop の束縛は 3。辞書の操作は 0・1・2）で dict_rw_x・loop_rw_x に渡し、返した式の仮の変数を、書換え済みの被演算子の式（Rust の式のまま。節点の位置とメタも保つ）で置き換える。導入する名前は、検証済みの版の番号 b+1+k を Lower::fresh の k 番目の名前にする（従来の書換えと同じ順）。型は verified_ty で写して erase_x で消去する。写せない（型、被演算子の数、名前の桁あふれ）ときは従来の書換え（dict_op_rust、loop_rust）を使う。この接着は検証していない（[unproved] の rewrite-shape の (3)）。従来の書換えと同じ式を作ることは単体テストと corpus の比べで確かめた（検査）。",
  "crates/tlvm/src/hof.rs：v1.5 の map・filter・any・all・find・sort_by の書き換え（型検査の後に fold・reverse・cons・if・match_option・let の組み合わせへ。sort_by は fold による安定な挿入整列。検証済み部品は書き換え後の整形ソースを検査・実行する）。これを含むプログラムの fmt も診断用 formatter の出力をそのまま出す。api.rs は、検証済みの構文規則では普通の名前であるこの 6 語が呼び出し・宣言の名前の位置にあるとき、構文・名前の誤拒否の突き合わせを省く。v1.6 の loop も同じ（range(0, max) 上の fold と match_result・match_option に書き換える。状態は Result<S, S>）。hof_verified.rs（DECISION-43）の lower_hof が従来の経路に回したプログラム（hof を含まないプログラム、ループ・辞書の操作・表に型のない hof を含むプログラム）は、この関数が書き換える",
  "crates/tlvm/src/dict.rs、hof.rs：型の構文（Dict<K, V>、map などの hof の構文）は検証済み（段階 1b-1、1b-3、S1）。v1.9 の辞書 Dict<K, V> の操作の書き換え（型検査の後に dict_get などの操作を fold・eq・reverse・cons・let の組み合わせへ、型の Dict<K, V> を List<Pair<K, V>> へ。挿入順で鍵が相異なる列を各操作が保つ。操作の書き換えは段階 4 まで glue。検証済み部品は書き換え後の整形ソースを検査・実行する）。Dict、hof（map・filter・any・all・find・sort_by）、loop を含むプログラムは検証済みの経路の外（api.rs:779–785）。辞書を含むプログラムの fmt も診断用 formatter の出力をそのまま出す。api.rs は dict と dict_get などが呼び出し・宣言の名前の位置にあるとき、構文・名前の誤拒否の突き合わせを省く。values.rs は入力の辞書の鍵の重複を拒否する（E-INPUT-DICT-DUPLICATE-KEY）。拒否の有無と、最初の誤りが重複かどうかは検証済みの復号器と突き合わせる（cross_check。[proved] の 9.input-dict）。plain.rs の重複の拒否は検証済みの経路の外（glue）",
  "crates/tlvm/src/checker.rs の HofTypes（hof・dict・loop の書換えに使う型の表）：信頼の境界に残す（DECISION-38、2026-10-20）。写し（verus/src/hof_types.rs）と検証済みの型付け規則との一致は証明した（SH1。[proved] の hof-types-sh1）。写しと表が同じことは機械証明していない（crates/tlvm/tests/hof_types.rs が確かめる）。checker 自体は検証しない（[unproved] の hof-types-sh1-trust）",
  "crates/tlvm/src/generics.rs、records.rs、sums.rs、checker.rs：総称（G1。推奨どおり経路の外）。直和型は、範囲の内なら検証済みの経路に入る（段階 3、2026-10-28。api.rs の route_scope）。範囲の外は入らない。v1.10 の型引数（総称の関数・レコード型・直和型）。generics.rs が型引数を解決し、records.rs・sums.rs が総称の型の使用を型引数を置き換えた構造に展開し（型引数を推論する構築は展開で作る総称の関数の呼び出しにする）、checker.rs が総称の本体を型引数を不透明な型として検査して呼び出しごとの型引数を記録し、generics.rs が多相再帰を拒否して単相化する（使われた型引数の組ごとに複製。名前は重ならない名前、rec の印は複製に移る。複製 256 個・型引数 256 node まで）。単相化したプログラムを再検査し、検証済み部品は単相化・書き換え後の整形ソースを検査・実行する。単相化の誤りは検証済み型検査が拒否するか（E-INTERNAL-VERIFIED-MISMATCH）、複製元と違う本体を実行するかで、後者は保証の外。総称を含むプログラムの fmt も診断用 formatter の出力をそのまま出す",
  "crates/tlvm/src/api.rs の route_scope：検証済みの経路の範囲（api.rs の route_scope。記録と名前、範囲の直和型（記録と混ぜた形を含む。2026-10-28 に加えた）。再帰する型、総称、hof、loop、Dict、Option と Result の枝、`_` を二つ束縛する枝、枝の並びの後ろの `,` を外す。枝の並びの後ろの `,` は、検証済みの構文器が読まない（syntax.rs の parm1）。仕様（LPTL_design_v1.md:214 の `[ "," ]`）は許すので、構文器を仕様に揃えるまでは範囲の外）。末尾のコンマの記録の式（`P { a: x, }`）は、信頼側の構文器（parser.rs:937）が拒否する（設計書の record_items に合わせた。オーナーの決定 2026-10-20）。宣言の末尾のコンマは受理し、範囲の内（検証済みも受ける）。範囲の判定は経路に入れるものを限るだけで、外したものは従来の経路が判定する。",
  "crates/tlvm/src/packages.rs、imports.rs：v1.16 のパッケージ（ローカルの依存）。tlvm.json（厳格な JSON。鍵・値の形、名前と版の形、依存の path を検査する）を読み、`@名前/パス` の import を、ファイルの属するパッケージ（そのディレクトリから上へ最初に見つかる tlvm.json）の宣言した依存のディレクトリの中のファイルに結びつける。依存のマニフェストは使われたときに一度読み、名前と固定した版を照合する。解決の結果はつないだ一つの source（v1.11 と同じ）で、検証済み部品はそれを検査・実行する。依存の取り違え（ほかのディレクトリを読むこと）は検証の外で、読んだ依存の中身は検査・実行される source そのものになる。マニフェストの読み方と診断の位置の写像も検証されていない。",
